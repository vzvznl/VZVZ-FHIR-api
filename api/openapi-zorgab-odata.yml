components:
  schemas:
    Organization:
      type: object
      properties:
        _self:
          type: string
        _className:
          type: string
        _id:
          type: string
        agb:
          type: string
        active:
          type: boolean
          default: true
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        applicationIds:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        author:
          type: string
        comment:
          type: string
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
        displayName:
          type: string
        electronicServices:
          type: array
          items:
            oneOf:
            - $ref: "#/components/schemas/ElectronicServiceLSP"
            - $ref: "#/components/schemas/ElectronicServiceMedMij"
            - $ref: "#/components/schemas/ElectronicServiceIHE"
        endDate:
          type: string
        identifications:
          type: array
          items:
            $ref: "#/components/schemas/Identification"
        medMijZorgaanbiedernaam:
          type: string
        names:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationName"
        speciality:
          type: string
        startDate:
          type: string
        telecoms:
          type: array
          items:
            $ref: "#/components/schemas/Telecom"
        timestamp:
          type: string
        type:
          type: array
          description: Deprecated. Supported until 31-12-2020
          items:
            type: string
        types:
          type: array
          items:
            $ref: "#/components/schemas/Type"
        updateId:
          type: string
        ura:
          type: string
    OrganizationSummary:
      type: object
      properties:
        _self:
          type: string
        _id:
          type: string
        applicationIds:
          type: array
          items:
            type: string
        displayName:
          type: string
        type:
          type: array
          description: Deprecated. Supported until 31-12-2020
          items:
            type: string
        types:
          type: array
          items:
            $ref: "#/components/schemas/Type"
        ura:
          type: string
    Individual:
      type: object
      properties:
        _self:
          type: string
        _className:
          type: string
        _id:
          type: string
        active:
          type: boolean
          default: true
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/Address"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        author:
          type: string
