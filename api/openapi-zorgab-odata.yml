openapi: 3.0.0
info:
  title: ZORG-AB OAS
  description: |-
    ZORG-AB (Zorg Adresboek) is een centrale adresinformatievoorziening voor de Nederlandse zorgsector. Het biedt één betrouwbare en actuele bron met digitale adres- en endpointgegevens van zorgaanbieders en zorgverleners. Deze gegevens zijn essentieel voor veilige en efficiënte elektronische gegevensuitwisseling tussen zorgpartijen.

    **Wat is ZORG-AB:**
    - Een centrale bron met actuele en betrouwbare contactgegevens van zorgaanbieders en zorgverleners in Nederland.
    - Bevat niet alleen telefoonnummers en e-mailadressen, maar ook technische informatie zoals EDIFACT-adressen en koppelingen voor veilige digitale communicatie.
    - Wordt samengesteld uit meerdere registers Vektis AGB Services, UZI-register, MedMij, en VZVZ-gebruikersadministratie.

    **Doelgroep**
    - ICT- en XIS-leveranciers, integrators en zorgaanbieders die elektronische gegevensuitwisseling implementeren.
  contact:
    name: ZORG-AB
    url: https://www.vzvz.nl/diensten/gemeenschappelijke-diensten/zorg-ab
    email: zorg-ab@vzvz.nl
  version: "2.12"
servers:
- url: https://zab.test.lsp.aorta-zorg.nl/zab
  description: ZORG-AB Test
